  <style>
    :root {
      --lavender: #cac2da;
      --dark-gray: #2f2f40;
      --white: #ffffff;
      --light-gray: #f5f5f8;
      --accent: #5c5470;
      --name-color: #4a395d;

      /* dark mode vars */
      --bg-dark: #1e1e2c;
      --text-dark: #e4e4ec;
      --light-gray-dark: #2a2a3e;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--white);
      color: var(--dark-gray);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      transition: background .3s, color .3s;
    }
    img { max-width: 100%; display: block; }
    a { color: var(--dark-gray); text-decoration: none; }
    a:focus, button:focus { outline: 2px solid var(--lavender); outline-offset: 2px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, rgba(202,194,218,.95), rgba(202,194,218,.9));
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(47,47,64,.1);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .brand {
      font-family: Poppins, Inter, sans-serif;
      font-weight: 700;
      letter-spacing: .2px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      color: var(--name-color);
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--name-color);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .menu { display: flex; gap: 20px; align-items: center; }
    .menu a { font-weight: 600; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }
    .btn-contact { background: var(--accent); color: #fff; }
    .btn-contact:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(92,84,112,.25); }
    .btn-dark { background: var(--dark-gray); color: #fff; }
    .btn-dark:hover { opacity: .9; }
    .btn-ghost { background: transparent; border-color: rgba(47,47,64,.25); }

    /* Hero */
    .hero {
      background: linear-gradient(180deg, #fff, #fff 60%, var(--light-gray));
      padding: 56px 0 24px;
    }
    .hero h1 {
      font-family: Poppins, Inter, sans-serif;
      font-size: clamp(26px, 5vw, 42px);
      line-height: 1.15;
      margin: 0 0 10px;
    }
    .hero p { max-width: 780px; color: #4a4959; margin: 0 0 18px; }
    .hero .cta { display: flex; gap: 12px; flex-wrap: wrap; }
